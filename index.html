  <body style="background:#1a1612; margin:0;">
    <script>
      // Testing aid (inert unless ?forceRaf is in the URL): drives
      // requestAnimationFrame via MessageChannel while the tab is hidden so
      // automated/headless verification can exercise animations. Hidden tabs
      // never fire rAF, and setTimeout is throttled — MessageChannel is not.
      if (new URLSearchParams(location.search).has('forceRaf')) {
        (function () {
          var nativeRaf = window.requestAnimationFrame.bind(window)
          var queue = []
          var mc = new MessageChannel()
          var scheduled = false
          mc.port1.onmessage = function () {
            scheduled = false
            var cbs = queue
            queue = []
            var t = performance.now()
            for (var i = 0; i < cbs.length; i++) { try { cbs[i](t) } catch (e) { console.error(e) } }
          }
          window.requestAnimationFrame = function (cb) {
            if (document.visibilityState !== 'hidden') return nativeRaf(cb)
            queue.push(cb)
            if (!scheduled) { scheduled = true; mc.port2.postMessage(0) }
            return queue.length
          }
        })()
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
