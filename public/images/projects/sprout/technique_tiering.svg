<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif">
  <rect x="8" y="8" width="1384" height="934" rx="26" fill="#242220"/>
  <text x="48" y="70" font-size="24" font-weight="bold" fill="#c9c3b8">Right-sized models — every feature runs on the cheapest model that does the job honestly</text>

  <!-- column headers -->
  <text x="70" y="130" font-size="17" font-weight="bold" fill="#8a847a">TIER</text>
  <text x="330" y="130" font-size="17" font-weight="bold" fill="#8a847a">ANTHROPIC</text>
  <text x="560" y="130" font-size="17" font-weight="bold" fill="#8a847a">OPENAI</text>
  <text x="820" y="130" font-size="17" font-weight="bold" fill="#8a847a">WHAT RUNS ON IT</text>

  <!-- CHEAP tier -->
  <rect x="48" y="150" width="1304" height="182" rx="20" fill="#2e2b28" stroke="#4a463f" stroke-width="2"/>
  <rect x="70" y="176" width="230" height="130" rx="14" fill="#0E9F7A"/>
  <text x="90" y="214" font-size="25" font-weight="bold" fill="#ffffff">Cheap / fast</text>
  <text x="90" y="244" font-size="18" fill="#e6e0d6">runs many times</text>
  <text x="90" y="268" font-size="18" fill="#e6e0d6">every single day</text>
  <rect x="330" y="176" width="200" height="60" rx="12" fill="#6D5BD8"/>
  <text x="350" y="213" font-size="20" font-weight="bold" fill="#ffffff">Haiku 4.5</text>
  <rect x="560" y="176" width="230" height="60" rx="12" fill="#6D5BD8"/>
  <text x="580" y="206" font-size="20" font-weight="bold" fill="#ffffff">gpt-4.1-mini</text>
  <text x="580" y="228" font-size="15" fill="#e6e0d6">deliberately non-reasoning</text>
  <text x="820" y="205" font-size="18" fill="#e6e0d6">daily brief polish · insight phrasing · weekly</text>
  <text x="820" y="230" font-size="18" fill="#e6e0d6">reflection · memory folding</text>
  <text x="820" y="270" font-size="17" fill="#cfc9bf" font-style="italic">rewording precomputed facts needs zero</text>
  <text x="820" y="293" font-size="17" fill="#cfc9bf" font-style="italic">reasoning inside 80–420-token budgets</text>

  <!-- STRONG tier -->
  <rect x="48" y="356" width="1304" height="182" rx="20" fill="#2e2b28" stroke="#4a463f" stroke-width="2"/>
  <rect x="70" y="382" width="230" height="130" rx="14" fill="#0E9F7A"/>
  <text x="90" y="420" font-size="25" font-weight="bold" fill="#ffffff">Strong</text>
  <text x="90" y="450" font-size="18" fill="#e6e0d6">the daily workhorse</text>
  <text x="90" y="474" font-size="18" fill="#e6e0d6">$2.50–3 class</text>
  <rect x="330" y="382" width="200" height="60" rx="12" fill="#6D5BD8"/>
  <text x="350" y="419" font-size="20" font-weight="bold" fill="#ffffff">Sonnet 5</text>
  <rect x="560" y="382" width="230" height="60" rx="12" fill="#6D5BD8"/>
  <text x="580" y="412" font-size="20" font-weight="bold" fill="#ffffff">gpt-5.6-terra</text>
  <text x="580" y="434" font-size="15" fill="#e6e0d6">reasoning pinned low</text>
  <text x="820" y="411" font-size="18" fill="#e6e0d6">Vita chat + tools · meal-photo vision ·</text>
  <text x="820" y="436" font-size="18" fill="#e6e0d6">checklist · quick prompts</text>
  <text x="820" y="476" font-size="17" fill="#cfc9bf" font-style="italic">upgraded the moment newer generations</text>
  <text x="820" y="499" font-size="17" fill="#cfc9bf" font-style="italic">hit price parity</text>

  <!-- HEAVY tier -->
  <rect x="48" y="562" width="1304" height="182" rx="20" fill="#2e2b28" stroke="#4a463f" stroke-width="2"/>
  <rect x="70" y="588" width="230" height="130" rx="14" fill="#B8842C"/>
  <text x="90" y="626" font-size="25" font-weight="bold" fill="#ffffff">Heavy (rare)</text>
  <text x="90" y="656" font-size="18" fill="#e6e0d6">a handful of calls</text>
  <text x="90" y="680" font-size="18" fill="#e6e0d6">EVER per user</text>
  <rect x="330" y="588" width="200" height="60" rx="12" fill="#6D5BD8"/>
  <text x="350" y="625" font-size="20" font-weight="bold" fill="#ffffff">Opus 4.8</text>
  <rect x="560" y="588" width="230" height="60" rx="12" fill="#6D5BD8"/>
  <text x="580" y="625" font-size="20" font-weight="bold" fill="#ffffff">gpt-5.6-sol</text>
  <text x="820" y="617" font-size="18" fill="#e6e0d6">one-time adaptive plan build / review ·</text>
  <text x="820" y="642" font-size="18" fill="#e6e0d6">live web-search research</text>
  <text x="820" y="682" font-size="17" fill="#cfc9bf" font-style="italic">Fable 5 evaluated and rejected — 2× price,</text>
  <text x="820" y="705" font-size="17" fill="#cfc9bf" font-style="italic">no transfer to this workload</text>

  <!-- punchline -->
  <rect x="48" y="778" width="1304" height="120" rx="20" fill="#2e2b28" stroke="#E8A838" stroke-width="2"/>
  <text x="700" y="828" font-size="26" font-weight="bold" fill="#E8A838" text-anchor="middle">The model invoked many times a day is the cheap one.</text>
  <text x="700" y="862" font-size="20" fill="#e6e0d6" text-anchor="middle">The expensive one is reserved for the feature used a few times ever — and every choice has a written defense in docs/MODEL_CHOICES.md</text>
</svg>
