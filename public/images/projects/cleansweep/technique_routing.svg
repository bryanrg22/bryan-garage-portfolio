<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="mP" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E8A838"/></marker>
    <marker id="mI" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b0aaa0"/></marker>
    <marker id="mA" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9a948a"/></marker>
  </defs>

  <rect x="8" y="8" width="1384" height="934" rx="26" fill="#242220"/>

  <!-- ============ GROUP A: bin state + travel times ============ -->
  <rect x="36" y="36" width="644" height="350" rx="20" fill="#2e2b28" stroke="#4a463f" stroke-width="2"/>
  <text x="60" y="74" font-size="24" font-weight="bold" fill="#c9c3b8">① Bin state &amp; travel times — dataFormat.js</text>

  <rect x="60" y="96" width="276" height="140" rx="14" fill="#0E9F7A"/>
  <text x="76" y="130" font-size="25" font-weight="bold" fill="#ffffff">10 Harvard bins</text>
  <text x="76" y="160" font-size="18" fill="#e6e0d6">lat/lng + place name</text>
  <text x="76" y="186" font-size="18" fill="#e6e0d6">fill_level 0–5</text>
  <text x="76" y="212" font-size="18" fill="#e6e0d6">days_since_last_picked</text>

  <line x1="336" y1="166" x2="384" y2="166" stroke="#b0aaa0" stroke-width="2.5" marker-end="url(#mI)"/>
  <text x="362" y="152" font-size="17" fill="#cfc9bf" text-anchor="middle">coords</text>

  <rect x="390" y="96" width="272" height="140" rx="14" fill="#0E9F7A"/>
  <text x="406" y="130" font-size="25" font-weight="bold" fill="#ffffff">Matrix builder</text>
  <text x="406" y="160" font-size="18" fill="#e6e0d6">GET /start/:id/:level</text>
  <text x="406" y="186" font-size="18" fill="#e6e0d6">10×10 = 100 API calls</text>
  <text x="406" y="212" font-size="18" fill="#e6e0d6">→ garbageCansData.json</text>

  <line x1="526" y1="236" x2="526" y2="264" stroke="#E8A838" stroke-width="3" marker-end="url(#mP)"/>
  <text x="540" y="258" font-size="17" fill="#cfc9bf">100 GETs</text>

  <rect x="390" y="270" width="272" height="100" rx="14" fill="#B34A3E"/>
  <text x="406" y="302" font-size="25" font-weight="bold" fill="#ffffff">Distance Matrix</text>
  <text x="406" y="330" font-size="18" fill="#e6e0d6">Google Maps API</text>
  <text x="406" y="356" font-size="18" fill="#e6e0d6">duration.text per pair</text>

  <!-- ============ GROUP B: priority model ============ -->
  <rect x="740" y="36" width="624" height="350" rx="20" fill="#2e2b28" stroke="#4a463f" stroke-width="2"/>
  <text x="764" y="74" font-size="24" font-weight="bold" fill="#c9c3b8">② Priority model — temp.py on Databricks</text>

  <rect x="764" y="96" width="270" height="140" rx="14" fill="#0E9F7A"/>
  <text x="780" y="130" font-size="25" font-weight="bold" fill="#ffffff">Rule labeler</text>
  <text x="780" y="160" font-size="18" fill="#e6e0d6">priority: fill ≥ 3</text>
  <text x="780" y="186" font-size="18" fill="#e6e0d6">OR days ≥ 5</text>
  <text x="780" y="212" font-size="18" fill="#e6e0d6">empty (fill 0) excluded</text>

  <line x1="1034" y1="166" x2="1078" y2="166" stroke="#b0aaa0" stroke-width="2.5" marker-end="url(#mI)"/>
  <text x="1057" y="152" font-size="17" fill="#cfc9bf" text-anchor="middle">0/1</text>

  <rect x="1084" y="96" width="260" height="140" rx="14" fill="#0E9F7A"/>
  <text x="1100" y="130" font-size="25" font-weight="bold" fill="#ffffff">RandomForest</text>
  <text x="1100" y="160" font-size="18" fill="#e6e0d6">max_depth=5</text>
  <text x="1100" y="186" font-size="18" fill="#e6e0d6">min_samples_split=3</text>
  <text x="1100" y="212" font-size="18" fill="#e6e0d6">StandardScaler, 80/20</text>

  <!-- ============ GROUP C: nearest-neighbor route ============ -->
  <rect x="36" y="414" width="880" height="450" rx="20" fill="#2e2b28" stroke="#4a463f" stroke-width="2"/>
  <text x="60" y="452" font-size="24" font-weight="bold" fill="#c9c3b8">③ Nearest-neighbor route — committed demo run</text>

  <rect x="60" y="474" width="300" height="140" rx="14" fill="#0E9F7A"/>
  <text x="76" y="508" font-size="25" font-weight="bold" fill="#ffffff">Nearest neighbor</text>
  <text x="76" y="538" font-size="18" fill="#e6e0d6">greedy: closest unvisited</text>
  <text x="76" y="564" font-size="18" fill="#e6e0d6">7×7 minutes matrix</text>
  <text x="76" y="590" font-size="18" fill="#e6e0d6">start: first prioritized</text>

  <line x1="360" y1="542" x2="374" y2="542" stroke="#b0aaa0" stroke-width="2.5" marker-end="url(#mI)"/>

  <!-- route pills -->
  <text x="380" y="498" font-size="17" fill="#cfc9bf">visit order — route[] in orderedGarbageCansData.json</text>
  <g>
    <rect x="380" y="520" width="46" height="40" rx="10" fill="#E8A838"/>
    <text x="403" y="548" font-size="22" font-weight="bold" fill="#242220" text-anchor="middle">2</text>
    <rect x="456" y="520" width="46" height="40" rx="10" fill="#E8A838"/>
    <text x="479" y="548" font-size="22" font-weight="bold" fill="#242220" text-anchor="middle">7</text>
    <rect x="532" y="520" width="46" height="40" rx="10" fill="#E8A838"/>
    <text x="555" y="548" font-size="22" font-weight="bold" fill="#242220" text-anchor="middle">5</text>
    <rect x="608" y="520" width="46" height="40" rx="10" fill="#E8A838"/>
    <text x="631" y="548" font-size="22" font-weight="bold" fill="#242220" text-anchor="middle">8</text>
    <rect x="684" y="520" width="46" height="40" rx="10" fill="#E8A838"/>
    <text x="707" y="548" font-size="22" font-weight="bold" fill="#242220" text-anchor="middle">9</text>
    <rect x="760" y="520" width="46" height="40" rx="10" fill="#E8A838"/>
    <text x="783" y="548" font-size="22" font-weight="bold" fill="#242220" text-anchor="middle">10</text>
    <rect x="836" y="520" width="46" height="40" rx="10" fill="#E8A838"/>
    <text x="859" y="548" font-size="22" font-weight="bold" fill="#242220" text-anchor="middle">4</text>
  </g>
  <g font-size="15" fill="#8a847a" text-anchor="middle">
    <text x="441" y="545">→</text><text x="517" y="545">→</text><text x="593" y="545">→</text>
    <text x="669" y="545">→</text><text x="745" y="545">→</text><text x="821" y="545">→</text>
    <text x="441" y="582">1m</text><text x="517" y="582">5m</text><text x="593" y="582">3m</text>
    <text x="669" y="582">3m</text><text x="745" y="582">4m</text><text x="821" y="582">8m</text>
  </g>
  <text x="380" y="606" font-size="15" fill="#8a847a">leg minutes from the Google duration matrix · total 24 min</text>

  <!-- bin chart -->
  <text x="110" y="640" font-size="18" fill="#e6e0d6">fill_level per bin — green badge = pickup order</text>
  <text x="880" y="640" font-size="18" fill="#e6e0d6" text-anchor="end">bin 5: fill 1, 7 days → picked</text>
  <text x="880" y="662" font-size="18" fill="#e6e0d6" text-anchor="end">bin 6: empty at 5 days → skipped</text>

  <g stroke="#3a3733" stroke-width="1">
    <line x1="104" y1="758" x2="890" y2="758"/><line x1="104" y1="736" x2="890" y2="736"/>
    <line x1="104" y1="714" x2="890" y2="714"/><line x1="104" y1="692" x2="890" y2="692"/>
    <line x1="104" y1="670" x2="890" y2="670"/>
  </g>
  <g font-size="15" fill="#cfc9bf" text-anchor="end">
    <text x="94" y="763">1</text><text x="94" y="741">2</text><text x="94" y="719">3</text>
    <text x="94" y="697">4</text><text x="94" y="675">5</text>
  </g>

  <!-- bars: fill = [1,4,2,4,1,0,5,3,4,2], 22px per level, baseline 780 -->
  <rect x="128" y="758" width="44" height="22" fill="#E8A838"/>
  <rect x="206" y="692" width="44" height="88" fill="#E8A838"/>
  <rect x="284" y="736" width="44" height="44" fill="#E8A838"/>
  <rect x="362" y="692" width="44" height="88" fill="#E8A838"/>
  <rect x="440" y="758" width="44" height="22" fill="#E8A838"/>
  <rect x="596" y="670" width="44" height="110" fill="#E8A838"/>
  <rect x="674" y="714" width="44" height="66" fill="#E8A838"/>
  <rect x="752" y="692" width="44" height="88" fill="#E8A838"/>
  <rect x="830" y="736" width="44" height="44" fill="#E8A838"/>
  <line x1="104" y1="780" x2="890" y2="780" stroke="#4a463f" stroke-width="2"/>

  <!-- fill value labels inside bars -->
  <g font-size="18" font-weight="bold" fill="#242220" text-anchor="middle">
    <text x="150" y="775">1</text><text x="228" y="712">4</text><text x="306" y="757">2</text>
    <text x="384" y="712">4</text><text x="462" y="775">1</text><text x="618" y="690">5</text>
    <text x="696" y="734">3</text><text x="774" y="712">4</text><text x="852" y="757">2</text>
  </g>
  <text x="540" y="775" font-size="18" font-weight="bold" fill="#8a847a" text-anchor="middle">0</text>

  <!-- x labels: bin id / days / pickup-order badges -->
  <text x="94" y="806" font-size="15" fill="#cfc9bf" text-anchor="end">bin</text>
  <g font-size="17" fill="#cfc9bf" text-anchor="middle">
    <text x="150" y="806">1</text><text x="228" y="806">2</text><text x="306" y="806">3</text>
    <text x="384" y="806">4</text><text x="462" y="806">5</text><text x="540" y="806">6</text>
    <text x="618" y="806">7</text><text x="696" y="806">8</text><text x="774" y="806">9</text>
    <text x="852" y="806">10</text>
  </g>
  <text x="94" y="830" font-size="15" fill="#8a847a" text-anchor="end">days</text>
  <g font-size="15" fill="#8a847a" text-anchor="middle">
    <text x="150" y="830">1</text><text x="228" y="830">2</text><text x="306" y="830">3</text>
    <text x="384" y="830">4</text><text x="462" y="830">7</text><text x="540" y="830">5</text>
    <text x="618" y="830">1</text><text x="696" y="830">3</text><text x="774" y="830">2</text>
    <text x="852" y="830">6</text>
  </g>
  <text x="94" y="853" font-size="15" fill="#8a847a" text-anchor="end">order</text>
  <g>
    <circle cx="228" cy="848" r="13" fill="#0E9F7A"/><text x="228" y="853" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <circle cx="384" cy="848" r="13" fill="#0E9F7A"/><text x="384" y="853" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>
    <circle cx="462" cy="848" r="13" fill="#0E9F7A"/><text x="462" y="853" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    <circle cx="618" cy="848" r="13" fill="#0E9F7A"/><text x="618" y="853" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    <circle cx="696" cy="848" r="13" fill="#0E9F7A"/><text x="696" y="853" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    <circle cx="774" cy="848" r="13" fill="#0E9F7A"/><text x="774" y="853" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
    <circle cx="852" cy="848" r="13" fill="#0E9F7A"/><text x="852" y="853" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
  </g>

  <!-- ============ GROUP D: driver portal ============ -->
  <rect x="944" y="414" width="420" height="450" rx="20" fill="#2e2b28" stroke="#4a463f" stroke-width="2"/>
  <text x="968" y="452" font-size="24" font-weight="bold" fill="#c9c3b8">④ Driver portal</text>

  <rect x="974" y="474" width="366" height="150" rx="14" fill="#B8842C"/>
  <text x="990" y="508" font-size="25" font-weight="bold" fill="#ffffff">Driver portal — React</text>
  <text x="990" y="538" font-size="18" fill="#e6e0d6">MainPage.jsx (React 18 + Vite)</text>
  <text x="990" y="564" font-size="18" fill="#e6e0d6">orders stops by route[]</text>
  <text x="990" y="590" font-size="18" fill="#e6e0d6">per-leg + total ETA</text>

  <line x1="1157" y1="624" x2="1157" y2="654" stroke="#E8A838" stroke-width="3" marker-end="url(#mP)"/>
  <text x="1170" y="646" font-size="17" fill="#cfc9bf">directions request</text>

  <rect x="974" y="660" width="366" height="140" rx="14" fill="#B34A3E"/>
  <text x="990" y="694" font-size="25" font-weight="bold" fill="#ffffff">Maps JavaScript API</text>
  <text x="990" y="724" font-size="18" fill="#e6e0d6">DirectionsRenderer polyline</text>
  <text x="990" y="750" font-size="18" fill="#e6e0d6">stroke #2196F3, weight 5</text>
  <text x="990" y="776" font-size="18" fill="#e6e0d6">suppressMarkers + custom pins</text>

  <!-- blue route squiggle -->
  <polyline points="990,838 1060,816 1130,834 1210,812 1280,830 1330,818" fill="none" stroke="#2196F3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="990" cy="838" r="7" fill="#0E9F7A"/>
  <circle cx="1130" cy="834" r="7" fill="#E8A838"/>
  <circle cx="1210" cy="812" r="7" fill="#E8A838"/>
  <circle cx="1330" cy="818" r="7" fill="#B34A3E"/>
  <text x="1157" y="858" font-size="15" fill="#8a847a" text-anchor="middle">depot: Public Works, 147 Hampshire St</text>

  <!-- cross-group arrows (drawn last so group panels never cover them) -->
  <line x1="662" y1="176" x2="758" y2="176" stroke="#9a948a" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#mA)"/>
  <text x="713" y="144" font-size="17" fill="#cfc9bf" text-anchor="middle">DBFS relay</text>
  <text x="713" y="164" font-size="17" fill="#cfc9bf" text-anchor="middle">10 s polls</text>

  <path d="M 1214 236 L 1214 400 L 48 400 L 48 544 L 54 544" fill="none" stroke="#E8A838" stroke-width="3" marker-end="url(#mP)"/>
  <text x="700" y="392" font-size="17" fill="#cfc9bf" text-anchor="middle">predicted priority = 1 → 7 of 10 bins</text>

  <line x1="882" y1="545" x2="968" y2="545" stroke="#E8A838" stroke-width="3" marker-end="url(#mP)"/>
  <text x="928" y="533" font-size="17" fill="#cfc9bf" text-anchor="middle">axios GET</text>
  <text x="928" y="570" font-size="17" fill="#cfc9bf" text-anchor="middle">/routeData</text>

  <!-- legend -->
  <line x1="60" y1="905" x2="120" y2="905" stroke="#E8A838" stroke-width="3" marker-end="url(#mP)"/>
  <text x="132" y="911" font-size="17" fill="#cfc9bf">primary flow</text>
  <line x1="280" y1="905" x2="340" y2="905" stroke="#b0aaa0" stroke-width="2.5" marker-end="url(#mI)"/>
  <text x="352" y="911" font-size="17" fill="#cfc9bf">internal step</text>
  <line x1="500" y1="905" x2="560" y2="905" stroke="#9a948a" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#mA)"/>
  <text x="572" y="911" font-size="17" fill="#cfc9bf">async polling</text>
  <text x="1364" y="911" font-size="15" fill="#8a847a" text-anchor="end">route + leg minutes: backend/orderedGarbageCansData.json (committed run)</text>
</svg>
