<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E8A838"/></marker>
  </defs>

  <rect x="8" y="8" width="1384" height="934" rx="26" fill="#242220"/>

  <!-- pipeline group -->
  <rect x="32" y="32" width="1336" height="210" rx="20" fill="#2e2b28" stroke="#4a463f" stroke-width="2"/>
  <text x="60" y="68" font-size="24" font-weight="bold" fill="#c9c3b8">Offline GLB pipeline — gltf-transform</text>
  <line x1="1150" y1="60" x2="1200" y2="60" stroke="#E8A838" stroke-width="3" marker-end="url(#arrAmber)"/>
  <text x="1212" y="66" font-size="17" fill="#cfc9bf">primary flow</text>

  <rect x="52" y="78" width="235" height="130" rx="14" fill="#B8842C"/>
  <text x="72" y="112" font-size="25" font-weight="bold" fill="#ffffff">Raw GLBs</text>
  <text x="72" y="140" font-size="18" fill="#e6e0d6">36 MB folder</text>
  <text x="72" y="164" font-size="18" fill="#e6e0d6">game-rip models,</text>
  <text x="72" y="188" font-size="18" fill="#e6e0d6">big embedded PNGs</text>

  <rect x="313" y="78" width="235" height="130" rx="14" fill="#6D5BD8"/>
  <text x="333" y="112" font-size="25" font-weight="bold" fill="#ffffff">1 · resize</text>
  <text x="333" y="140" font-size="18" fill="#e6e0d6">textures capped</text>
  <text x="333" y="164" font-size="18" fill="#e6e0d6">at 1024 × 1024 px</text>
  <text x="333" y="188" font-size="18" fill="#e6e0d6">(--width 1024)</text>

  <rect x="574" y="78" width="235" height="130" rx="14" fill="#6D5BD8"/>
  <text x="594" y="112" font-size="25" font-weight="bold" fill="#ffffff">2 · webp</text>
  <text x="594" y="140" font-size="18" fill="#e6e0d6">EXT_texture_webp</text>
  <text x="594" y="164" font-size="18" fill="#e6e0d6">— native in three</text>
  <text x="594" y="188" font-size="18" fill="#e6e0d6">GLTFLoader</text>

  <rect x="835" y="78" width="235" height="130" rx="14" fill="#6D5BD8"/>
  <text x="855" y="112" font-size="25" font-weight="bold" fill="#ffffff">3 · draco</text>
  <text x="855" y="140" font-size="18" fill="#e6e0d6">compresses</text>
  <text x="855" y="164" font-size="18" fill="#e6e0d6">geometry only —</text>
  <text x="855" y="188" font-size="18" fill="#e6e0d6">not textures</text>

  <rect x="1096" y="78" width="235" height="130" rx="14" fill="#0E9F7A"/>
  <text x="1116" y="112" font-size="25" font-weight="bold" fill="#ffffff">Shipped GLBs</text>
  <text x="1116" y="140" font-size="18" fill="#e6e0d6">14 MB deployed</text>
  <text x="1116" y="164" font-size="18" fill="#e6e0d6">−61% vs raw;</text>
  <text x="1116" y="188" font-size="18" fill="#e6e0d6">Draco + WebP</text>

  <line x1="289" y1="143" x2="309" y2="143" stroke="#E8A838" stroke-width="3" marker-end="url(#arrAmber)"/>
  <line x1="550" y1="143" x2="570" y2="143" stroke="#E8A838" stroke-width="3" marker-end="url(#arrAmber)"/>
  <line x1="811" y1="143" x2="831" y2="143" stroke="#E8A838" stroke-width="3" marker-end="url(#arrAmber)"/>
  <line x1="1072" y1="143" x2="1092" y2="143" stroke="#E8A838" stroke-width="3" marker-end="url(#arrAmber)"/>

  <!-- chart group -->
  <rect x="32" y="268" width="1336" height="520" rx="20" fill="#2e2b28" stroke="#4a463f" stroke-width="2"/>
  <text x="60" y="304" font-size="24" font-weight="bold" fill="#c9c3b8">Per-model GLB size — before → after (bytes from commit ba993d1)</text>
  <rect x="1080" y="284" width="26" height="14" fill="#E8A838"/>
  <text x="1114" y="296" font-size="17" fill="#cfc9bf">before</text>
  <rect x="1190" y="284" width="26" height="14" fill="#0E9F7A"/>
  <text x="1224" y="296" font-size="17" fill="#cfc9bf">after</text>

  <!-- gridlines: 130px per MB -->
  <line x1="285" y1="316" x2="285" y2="700" stroke="#3a3733" stroke-width="1"/>
  <line x1="415" y1="316" x2="415" y2="700" stroke="#3a3733" stroke-width="1"/>
  <line x1="545" y1="316" x2="545" y2="700" stroke="#3a3733" stroke-width="1"/>
  <line x1="675" y1="316" x2="675" y2="700" stroke="#3a3733" stroke-width="1"/>
  <line x1="805" y1="316" x2="805" y2="700" stroke="#3a3733" stroke-width="1"/>
  <line x1="935" y1="316" x2="935" y2="700" stroke="#3a3733" stroke-width="1"/>
  <text x="285" y="722" font-size="17" fill="#cfc9bf" text-anchor="middle">0</text>
  <text x="415" y="722" font-size="17" fill="#cfc9bf" text-anchor="middle">1 MB</text>
  <text x="545" y="722" font-size="17" fill="#cfc9bf" text-anchor="middle">2 MB</text>
  <text x="675" y="722" font-size="17" fill="#cfc9bf" text-anchor="middle">3 MB</text>
  <text x="805" y="722" font-size="17" fill="#cfc9bf" text-anchor="middle">4 MB</text>
  <text x="935" y="722" font-size="17" fill="#cfc9bf" text-anchor="middle">5 MB</text>

  <!-- row 1: garage_tools 4.82 / 0.82 -->
  <text x="268" y="344" font-size="17" fill="#cfc9bf" text-anchor="end">garage_tools</text>
  <rect x="285" y="322" width="627" height="15" fill="#E8A838"/>
  <rect x="285" y="340" width="107" height="15" fill="#0E9F7A"/>
  <text x="926" y="344" font-size="22" font-weight="bold" fill="#ffffff">4.82 → 0.82 MB  −83%</text>

  <!-- row 2: nissan_gtr_r34 4.58 / 3.68 -->
  <text x="268" y="386" font-size="17" fill="#cfc9bf" text-anchor="end">nissan_gtr_r34</text>
  <rect x="285" y="364" width="595" height="15" fill="#E8A838"/>
  <rect x="285" y="382" width="478" height="15" fill="#0E9F7A"/>
  <text x="894" y="386" font-size="22" font-weight="bold" fill="#ffffff">4.58 → 3.68 MB  −20%</text>
  <text x="1160" y="386" font-size="18" fill="#e6e0d6">geometry-dominated</text>

  <!-- row 3: dirty_rag 3.60 / 2.64 -->
  <text x="268" y="428" font-size="17" fill="#cfc9bf" text-anchor="end">dirty_rag</text>
  <rect x="285" y="406" width="468" height="15" fill="#E8A838"/>
  <rect x="285" y="424" width="343" height="15" fill="#0E9F7A"/>
  <text x="767" y="428" font-size="22" font-weight="bold" fill="#ffffff">3.60 → 2.64 MB  −27%</text>

  <!-- row 4: macbook 2.74 / 0.94 -->
  <text x="268" y="470" font-size="17" fill="#cfc9bf" text-anchor="end">macbook</text>
  <rect x="285" y="448" width="356" height="15" fill="#E8A838"/>
  <rect x="285" y="466" width="122" height="15" fill="#0E9F7A"/>
  <text x="655" y="470" font-size="22" font-weight="bold" fill="#ffffff">2.74 → 0.94 MB  −66%</text>

  <!-- row 5: air_compressor 2.61 / 0.30 -->
  <text x="268" y="512" font-size="17" fill="#cfc9bf" text-anchor="end">air_compressor</text>
  <rect x="285" y="490" width="339" height="15" fill="#E8A838"/>
  <rect x="285" y="508" width="38" height="15" fill="#0E9F7A"/>
  <text x="638" y="512" font-size="22" font-weight="bold" fill="#ffffff">2.61 → 0.30 MB  −89%</text>

  <!-- row 6: retro_oil 2.08 / 0.26 -->
  <text x="268" y="554" font-size="17" fill="#cfc9bf" text-anchor="end">retro_oil</text>
  <rect x="285" y="532" width="270" height="15" fill="#E8A838"/>
  <rect x="285" y="550" width="33" height="15" fill="#0E9F7A"/>
  <text x="569" y="554" font-size="22" font-weight="bold" fill="#ffffff">2.08 → 0.26 MB  −88%</text>

  <!-- row 7: wd-40 2.05 / 0.24 -->
  <text x="268" y="596" font-size="17" fill="#cfc9bf" text-anchor="end">wd-40</text>
  <rect x="285" y="574" width="267" height="15" fill="#E8A838"/>
  <rect x="285" y="592" width="31" height="15" fill="#0E9F7A"/>
  <text x="566" y="596" font-size="22" font-weight="bold" fill="#ffffff">2.05 → 0.24 MB  −88%</text>

  <!-- row 8: trash_can 1.31 / 0.09 -->
  <text x="268" y="638" font-size="17" fill="#cfc9bf" text-anchor="end">trash_can</text>
  <rect x="285" y="616" width="170" height="15" fill="#E8A838"/>
  <rect x="285" y="634" width="11" height="15" fill="#0E9F7A"/>
  <text x="469" y="638" font-size="22" font-weight="bold" fill="#ffffff">1.31 → 0.09 MB  −93%</text>

  <!-- row 9: mlb_trophy 0.91 / 0.91 -->
  <text x="268" y="680" font-size="17" fill="#cfc9bf" text-anchor="end">mlb_trophy</text>
  <rect x="285" y="658" width="119" height="15" fill="#E8A838"/>
  <rect x="285" y="676" width="118" height="15" fill="#0E9F7A"/>
  <text x="418" y="680" font-size="22" font-weight="bold" fill="#ffffff">0.91 → 0.91 MB  −0.7%</text>
  <text x="720" y="680" font-size="18" fill="#e6e0d6">no big textures — Draco alone barely helps</text>

  <!-- insight -->
  <text x="60" y="756" font-size="18" fill="#e6e0d6">Key insight: Draco compresses geometry only — the real payload was the embedded PNG textures.</text>
  <text x="60" y="778" font-size="18" fill="#e6e0d6">Texture-heavy props collapsed 83–93% after resize + WebP; texture-light models barely moved.</text>

  <!-- numbers tiles -->
  <rect x="32" y="808" width="316" height="110" rx="20" fill="#2e2b28" stroke="#4a463f" stroke-width="2"/>
  <text x="190" y="868" font-size="64" font-weight="bold" fill="#E8A838" text-anchor="middle">−61%</text>
  <text x="190" y="900" font-size="20" fill="#cfc9bf" text-anchor="middle">GLB folder: 36 → 14 MB</text>

  <rect x="372" y="808" width="316" height="110" rx="20" fill="#2e2b28" stroke="#4a463f" stroke-width="2"/>
  <text x="530" y="868" font-size="64" font-weight="bold" fill="#E8A838" text-anchor="middle">−93%</text>
  <text x="530" y="900" font-size="20" fill="#cfc9bf" text-anchor="middle">best cut: trash_can</text>

  <rect x="712" y="808" width="316" height="110" rx="20" fill="#2e2b28" stroke="#4a463f" stroke-width="2"/>
  <text x="870" y="868" font-size="64" font-weight="bold" fill="#E8A838" text-anchor="middle">48→7 MB</text>
  <text x="870" y="900" font-size="20" fill="#cfc9bf" text-anchor="middle">content images (WebP)</text>

  <rect x="1052" y="808" width="316" height="110" rx="20" fill="#2e2b28" stroke="#4a463f" stroke-width="2"/>
  <text x="1210" y="868" font-size="64" font-weight="bold" fill="#E8A838" text-anchor="middle">1024 px</text>
  <text x="1210" y="900" font-size="20" fill="#cfc9bf" text-anchor="middle">texture cap before WebP</text>

  <text x="700" y="938" font-size="15" fill="#8a847a" text-anchor="middle">Sources: git commit ba993d1 --stat (per-file byte sizes; images 48→7 MB from commit message) · README.md · CLAUDE.md</text>
</svg>