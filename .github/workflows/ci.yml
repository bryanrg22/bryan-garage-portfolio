name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Least privilege: CI only needs to read the code. Fork PRs never get secrets
# (and none are used here), and first-time contributors need approval to run.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job names are referenced by branch rulesets / Vercel Deployment Checks —
  # renaming a job means updating those settings too.
  checks:
    name: Lint, typecheck, unit tests, asset budgets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck + production build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: 3D asset validity + budgets
        run: npm run check:assets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          retention-days: 3

  e2e:
    name: Browser smoke test (3D scene)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - run: npx playwright install --with-deps chromium
      - name: Smoke test (loads every model, checks render, opens every panel)
        run: npx playwright test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          # Includes a screenshot of the home view — eyeball it on any PR that
          # touches the scene.
          name: playwright-report
          path: playwright-report
          retention-days: 14
